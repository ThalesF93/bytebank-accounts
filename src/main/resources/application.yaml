spring:
  cloud:
    openfeign:
      httpclient:
        hc5:
          enabled: true
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:bytebank}
    password: ${RABBITMQ_PASS:bytebank123}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 5000
          multiplier: 3
          max-interval: 10000
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
  cache:
    type: redis
    redis:
      time-to-live: 300000
  mvc:
    problemdetails:
      enabled: false
  application:
    name: bytebank-accounts
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/accounts_db
    username: ${DB_USERNAME:bytebank}
    password: ${DB_PASSWORD:bytebank}
server:
  port: 8082
eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true
logging:
  structured:
    format:
      file: logstash
  file:
    name: logs/accounts.json
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false
bytebank:
  accounts:
    generation:
      account-number-min: 10_000_000
      account-number-range: 90_000_000
      agency-min: 100_000
      agency-range: 900_000

kind: Application