server:
  port: 8082
spring:
  application:
    name: bytebank-accounts
  cloud:
    discovery:
      enabled: true
    openfeign:
      httpclient:
        hc5:
          enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/accounts_db
    username: ${DB_USERNAME:bytebank}
    password: ${DB_PASSWORD:bytebank}

  data:
    redis:
      host: localhost
      port: 6379

  rabbitmq:
    host: localhost
    port: 5672
    username: bytebank
    password: bytebank123
    listener:
      simple:
        auto-startup: true

eureka:
  client:
    enabled: true
    service-url:
        defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
        register-with-eureka: true
        fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans