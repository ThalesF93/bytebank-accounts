

spring:
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME}
    password: ${SPRING_RABBITMQ_PASSWORD}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 5000
          multiplier: 3
          max-interval: 10000

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

  cache:
    type: redis
    redis:
      time-to-live: 300000

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE}
  instance:
    hostname: ${HOSTNAME}
    prefer-ip-address: false
    instance-id: ${spring.application.name}:${HOSTNAME}

logging:
  structured:
    format:
      file: logstash
  file:
    name: /tmp/accounts.json

management:
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: false
server:
  address: 0.0.0.0

bytebank:
  accounts:
    generation:
      account-number-min: 10_000_000
      account-number-range: 90_000_000
      agency-min: 100_000
      agency-range: 900_000