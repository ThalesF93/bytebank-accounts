services:
  accounts-db:
    image: postgres:16
    container_name: accounts-db
    environment:
      POSTGRES_DB: accounts_db
      POSTGRES_USER: ${DB_USERNAME:-bytebank}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bytebank}
    ports:
      - "5433:5432"
    volumes:
      - accounts_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-bytebank} -d transactions_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bytebank-net

